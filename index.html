<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俗缘诡事</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Oswald:wght@200;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=142">
</head>
<body>
<div class="glitch-overlay">
    <div class="matrix-container" id="glitch-matrix"></div>
</div>

<div id="view-main" class="view active" style="display: block; opacity: 1;">
    
    <div class="hero-banner">
        <img src="hero-red.png" class="hero-layer red-layer" onerror="this.style.display='none'">
        <img src="hero-white.png" class="hero-layer white-layer" onerror="this.style.display='none'">
        <h1 class="hero-title">俗缘诡事</h1>
    </div>

    <nav class="top-nav" id="top-nav">
        <div class="nav-container">
            <a href="#section-home" class="nav-item">首页</a>
            <a href="#section-characters" class="nav-item">角色档案</a>
            <a href="#section-events" class="nav-item">事件索引</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <section id="section-home" class="content-section" style="height: 20px;"></section>

        <section id="section-characters" class="content-section">
            <div class="physics-stage">
                <!-- 贯穿背景的红线 -->
                <svg class="red-thread-svg" preserveAspectRatio="none" viewBox="0 0 1000 100">
                    <path id="main-thread-path" d="M 0,50 Q 500,50 1000,50" fill="none" stroke="var(--red)" stroke-width="2" />
                </svg>
                
                <div class="cards-scroll-container" id="cards-scroll">
                    <div class="cards-inner" id="cards-inner">
                        <!-- JS 生成 -->
                    </div>
                </div>
            </div>
        </section>

        <section id="section-events" class="content-section" style="height: 20px;"></section>
    </div>
</div>

<div id="view-profile" class="view">
    <div class="glitch-trigger" id="glitch-btn" onclick="toggleGlitch()"></div>
    <div class="nav-top">
        <div class="back-btn" onclick="switchView('view-main')">← BACK</div>
        <div class="id-tag" id="p-top-id">ID: UNKNOWN</div>
    </div>
    
    <div class="profile-wrap">
        <div class="hero-section">
            <div class="avatar-box" id="p-avatar-box"></div>
            <div class="hero-text">
                <h1 class="p-name" id="p-name">名字</h1>
                <div class="p-title" id="p-title">身份</div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="col-left">
                <div class="sec-title"><span>基础卷宗</span></div>
                <div class="info-list" id="p-info-list"></div>
                <div class="sec-title"><span>命理六维</span></div>
                <div class="stats-container" id="p-stats"></div>
            </div>
            
            <div class="col-right">
                <div class="sec-title"><span>生平轨迹</span></div>
                <div class="timeline" id="p-timeline"></div>
                <div class="sec-title"><span>人际羁绊</span></div>
                <div class="relations-list" id="p-relations"></div>
            </div>
        </div>
    </div>
</div>

<script src="data.js?v=142"></script>
<script src="script.js?v=142"></script>
</body>
</html>
