<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俗缘诡事</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Oswald:wght@200;400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=108">
</head>
<body>

<div class="glitch-overlay">
    <div class="matrix-container" id="glitch-matrix"></div>
</div>

<!-- 首页：白净留白 + 错落悬挂木牌 -->
<div id="view-main" class="view active">
    <div class="home-header">
        <img src="title.png" class="home-title-img" alt="俗缘诡事" onerror="this.style.display='none'">
        <div class="home-subtitle">俗缘诡事 · 卷宗</div>
    </div>
    
    <!-- 挂绳与木牌墙 -->
    <div class="tag-wall">
        <div id="dir-list" class="dir-list-inner"></div>
    </div>
</div>

<!-- 详情页 -->
<div id="view-profile" class="view">
    <div class="glitch-trigger" id="glitch-btn" onclick="toggleGlitch()"></div>
    <div class="nav-top">
        <div class="back-btn" onclick="switchView('view-main')">← BACK</div>
        <div class="id-tag" id="p-top-id"></div>
    </div>
    
    <!-- 修复了上方巨大空白的 profile-wrap -->
    <div class="profile-wrap">
        <div class="hero-section">
            <div class="avatar-box" id="p-avatar-box"></div>
            <div class="hero-text">
                <h1 class="p-name" id="p-name"></h1>
                <div class="p-title" id="p-title"></div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="col-left">
                <div class="sec-title"><span>基础卷宗</span></div>
                <div class="info-list" id="p-info-list"></div>
                
                <div class="sec-title" style="margin-top:50px;"><span>命理六维</span></div>
                <div class="stats-wrapper">
                    <div class="stats-container" id="p-stats"></div>
                </div>
            </div>
            
            <div class="col-right">
                <div class="sec-title"><span>生平轨迹</span></div>
                <div class="timeline" id="p-timeline"></div>
                
                <div class="sec-title" style="margin-top:50px;"><span>人际羁绊</span></div>
                <div class="relations-list" id="p-relations"></div>
            </div>
        </div>
        
        <footer>— 俗缘诡事 · 档案录 —</footer>
    </div>
</div>

<script src="data.js?v=108"></script>
<script src="script.js?v=108"></script>
</body>
</html>
