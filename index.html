<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俗缘诡事 · 角色档案库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root{
    /* 纯色宣纸底，如果你没有传背景图，就会显示这个颜色 */
    --bg: #f2efe9; 
    --bg2: #fbfaf7; 
    --line: rgba(51, 48, 46, 0.15);
    --paper: #2b2927; 
    --muted: #7a756e; 
    --cinnabar: #c9423b; 
    --gold: #a87e3f; 
    --jade: #3d7369;
    
    --serif: "Noto Serif SC", "Songti SC", serif;
    --kai: "ZCOOL XiaoWei", "Ma Shan Zheng", "KaiTi", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  
  body{
    background-color: var(--bg); 
    /* 👇 如果你传了一张名为 bg.jpg 的图片，它就会自动作为背景 */
    background-image: url('bg.jpg'); 
    background-size: cover; 
    background-position: center;
    background-attachment: fixed;
    background-blend-mode: multiply; /* 让图片和底色融合，不至于太刺眼 */
    
    color:var(--paper); font-family:var(--sans);
    line-height:1.8; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  
  .view { display: none; opacity: 0; transition: opacity .4s ease; position: relative; z-index: 1; }
  .view.active { display: block; opacity: 1; }

  /* ---------------- 主页面 ---------------- */
  #view-main { padding-bottom: 60px; }
  
  .main-header {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 20px 40px 20px;
    border-bottom: 2px solid var(--paper);
    margin-bottom: 30px;
  }
  
  .home-title-img {
    max-width: 90vw; max-height: 180px; object-fit: contain; 
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
  }

  .directory-section { padding: 20px 20px 0 20px; }
  
  .dir-header { 
    text-align: center; margin-bottom: 30px; 
    font-family: var(--serif); font-size: 18px; 
    letter-spacing: .4em; color: var(--paper); 
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .dir-header::before, .dir-header::after { content: "◆"; font-size: 10px; color: var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
  
  /* 古籍线装书式卡片 */
  .card {
    background: var(--bg2); padding: 24px; cursor: pointer;
    transition: .3s; position: relative; 
    border: 1px solid var(--paper);
    outline: 1px solid var(--line); outline-offset: -4px; 
  }
  .card:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(43, 41, 39, 0.08); }
  .card-name { font-family: var(--kai); font-size: 26px; font-weight: 900; letter-spacing: .1em; margin-bottom: 8px; color: var(--paper); border-bottom: 1px dashed var(--line); padding-bottom: 8px;}
  .card-title { font-size: 13px; color: var(--jade); letter-spacing: .05em; font-family: var(--serif); }

  /* ---------------- 详情页 ---------------- */
  #view-profile { padding-bottom: 60px; }
  .nav-top {
    position: sticky; top: 0; z-index: 50; background: rgba(242, 239, 233, 0.9);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--paper);
    padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .back-btn { font-size: 14px; color: var(--paper); cursor: pointer; letter-spacing: .1em; font-weight: 600; font-family: var(--serif);}
  
  .profile-wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
  
  .hero-section {
    display: grid; grid-template-columns: 280px 1fr; gap: 40px;
    border-bottom: 2px solid var(--paper); padding-bottom: 40px; margin-bottom: 40px;
    position: relative; align-items: flex-end; /* 改成底部对齐 */
  }

  /* 画像框：宣纸装裱感 */
  .avatar-box {
    width: 100%; aspect-ratio: 3/4; 
    background: #f7f5f0; 
    position: relative; 
    border: 1px solid var(--paper); padding: 8px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
  }
  .avatar-box img { 
    width: 100%; height: 100%; object-fit: cover; 
  }
  .avatar-box .empty-text { 
    display: flex; height: 100%; align-items: center; justify-content: center; 
    color: var(--muted); font-family: var(--serif); background: #f4f1ea;
  }

  .hero-text { display: flex; flex-direction: column; padding-bottom: 10px;}
  
  .p-name { font-family: var(--kai); font-size: clamp(48px, 8vw, 72px); font-weight: 900; letter-spacing: .1em; color: var(--paper); line-height: 1.1; margin-bottom: 10px;}
  
  .p-title { 
    font-family: var(--serif); font-size: 15px; color: var(--jade); 
    letter-spacing: .1em; 
  }

  .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .full-width { grid-column: 1 / -1; }

  /* 中式版块标题 */
  .sec-title {
    font-family: var(--serif); font-size: 18px; color: var(--paper); font-weight: 900;
    display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 24px;
    letter-spacing: .3em;
  }
  .sec-title::before, .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .info-box {
    background: var(--bg2); border: 1px solid var(--line); padding: 24px;
    outline: 1px solid var(--line); outline-offset: -4px;
  }
  .info-item { display: flex; border-bottom: 1px dashed var(--line); padding: 12px 0; }
  .info-item:last-child { border-bottom: none; padding-bottom: 0; }
  .info-item .k { width: 80px; color: var(--muted); font-size: 13px; font-family: var(--serif); flex-shrink: 0;}
  .info-item .v { font-family: var(--serif); font-size: 15px; color: var(--paper); font-weight: 600; }

  .stats-box { 
    background: var(--bg2); border: 1px solid var(--line); padding: 20px;
    outline: 1px solid var(--line); outline-offset: -4px;
    display: flex; justify-content: center;
  }

  .text-box { 
    background: transparent; padding: 10px 0; 
    font-family: var(--serif); font-size: 15px; color: var(--paper); line-height: 2.2; text-align: justify;
    text-indent: 2em; 
  }

  /* 卷宗时间线 */
  .timeline { padding-left: 10px; margin-top: 10px; border-left: 2px solid var(--line); }
  .tl-item { position: relative; margin-bottom: 24px; padding-left: 20px; }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-item::before { 
    content: ""; position: absolute; left: -7px; top: 6px; 
    width: 10px; height: 10px; background: var(--bg); border: 2px solid var(--jade); border-radius: 50%; 
  }
  .tl-time { font-family: var(--kai); font-size: 16px; font-weight: 900; color: var(--cinnabar); letter-spacing: .1em; margin-bottom: 4px; }
  .tl-event { font-size: 14.5px; color: var(--paper); font-family: var(--serif); }

  .relations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .rel-card {
    background: var(--bg2); border: 1px dashed var(--paper);
    padding: 16px; position: relative; transition: .3s;
  }
  .rel-card.has-link { cursor: pointer; }
  .rel-card.has-link:hover { background: #fff; border-style: solid; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .rel-card.no-link { opacity: 0.6; background: transparent; }
  .rel-name { font-family: var(--kai); font-size: 18px; font-weight: 900; color: var(--paper); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px;}
  .rel-card.has-link .rel-name::after { content: "→"; color: var(--gold); font-family: var(--sans); }
  .rel-desc { font-size: 13px; color: var(--muted); line-height: 1.6; font-family: var(--serif); }

  footer { padding: 40px 0; text-align: center; font-size: 12px; letter-spacing: .5em; color: var(--muted); border-top: 1px solid var(--line); margin-top: 50px; font-family: var(--serif); }

  /* 手机端适配 */
  @media (max-width: 768px) {
    .hero-section { grid-template-columns: 1fr; gap: 20px; text-align: center; align-items: center;}
    .avatar-box { max-width: 240px; margin: 0 auto; }
    .hero-text { align-items: center; }
    .content-grid { grid-template-columns: 1fr; gap: 40px; }
    .info-item .k { width: 70px; }
  }
</style>
</head>
<body>

<!-- 视图 1：主页面 -->
<div id="view-main" class="view active">
  <header class="main-header">
    <img src="title.png" class="home-title-img" alt="俗缘诡事" onerror="this.style.display='none'">
  </header>

  <div class="directory-section">
    <div class="dir-header">人 物 索 引</div>
    <div class="grid" id="dir-grid"></div>
  </div>
</div>

<!-- 视图 2：角色详情 -->
<div id="view-profile" class="view">
  <div class="nav-top">
    <div class="back-btn" onclick="switchView('view-main')">← 返回卷宗</div>
    <div style="font-size:12px; color:var(--muted); letter-spacing:.1em; font-family:var(--serif)" id="p-top-id">档案号</div>
  </div>
  
  <div class="profile-wrap">
    
    <div class="hero-section">
      <div class="avatar-box" id="p-avatar-box"></div>
      
      <!-- 去掉了花里胡哨的排版，只保留名字和身份 -->
      <div class="hero-text">
        <h1 class="p-name" id="p-name"></h1>
        <div class="p-title" id="p-title"></div>
      </div>
    </div>

    <div class="content-grid">
      
      <div>
        <div class="sec-title">基础卷宗</div>
        <div class="info-box" id="p-info-grid"></div>
        
        <div class="sec-title" style="margin-top: 40px;">命理六维</div>
        <div class="stats-box" id="p-stats"></div>
      </div>

      <div>
        <div class="sec-title">性格侧写</div>
        <div class="text-box" id="p-personality"></div>

        <div class="sec-title" style="margin-top: 40px;">生平轨迹</div>
        <div class="timeline" id="p-timeline"></div>
      </div>

      <div class="full-width">
        <div class="sec-title">人际羁绊</div>
        <div class="relations-grid" id="p-relations"></div>
      </div>

    </div>
    
    <footer>俗缘诡事 · 秘档库</footer>
  </div>
</div>

<script src="data.js"></script>

<script>
  function renderDirectory() {
    const grid = document.getElementById('dir-grid');
    if (typeof ocDatabase === 'undefined') {
      grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #c9423b; padding: 40px; border: 1px dashed #c9423b; font-family:var(--serif)"><h3>卷宗加载失败</h3><p>未找到 data.js 文件</p></div>`;
      return;
    }
    grid.innerHTML = '';
    ocDatabase.forEach(oc => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = function() { showProfile(oc.id); };
      card.innerHTML = `
        <div class="card-name">${oc.name}</div>
        <div class="card-title">${oc.title}</div>
      `;
      grid.appendChild(card);
    });
  }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function renderRadarChart(stats, containerId) {
    const width = 300, height = 260;
    const cx = width / 2, cy = height / 2 + 10;
    const r = 80; 
    const keys = Object.keys(stats); 
    const n = keys.length; 
    const maxVal = 6; 
    
    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:300px; overflow:visible;">`;
    
    for (let level = 1; level <= maxVal; level++) {
      let points = [];
      let currentR = (r * level) / maxVal;
      for (let i = 0; i < n; i++) {
        let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        let x = cx + currentR * Math.cos(angle);
        let y = cy + currentR * Math.sin(angle);
        points.push(`${x},${y}`);
      }
      let strokeColor = level === maxVal ? "rgba(51, 48, 46, 0.3)" : "rgba(51, 48, 46, 0.08)";
      svg += `<polygon points="${points.join(' ')}" fill="none" stroke="${strokeColor}" stroke-width="1" />`;
    }
    
    for (let i = 0; i < n; i++) {
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let x = cx + r * Math.cos(angle);
      let y = cy + r * Math.sin(angle);
      svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(51, 48, 46, 0.1)" stroke-width="1" />`;
    }
    
    let dataPoints = [];
    for (let i = 0; i < n; i++) {
      let val = stats[keys[i]];
      let currentR = (r * val) / maxVal;
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let x = cx + currentR * Math.cos(angle);
      let y = cy + currentR * Math.sin(angle);
      dataPoints.push(`${x},${y}`);
    }
    
    // 【修改】水墨灰描边，极淡的青灰填充
    svg += `<polygon points="${dataPoints.join(' ')}" fill="rgba(61, 115, 105, 0.08)" stroke="#555555" stroke-width="1.5" stroke-linejoin="round" />`;
    
    for (let i = 0; i < n; i++) {
      let key = keys[i];
      let val = stats[key];
      let currentR = (r * val) / maxVal;
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let x = cx + currentR * Math.cos(angle);
      let y = cy + currentR * Math.sin(angle);
      
      // 【修改】节点变成深灰
      svg += `<circle cx="${x}" cy="${y}" r="3" fill="#fff" stroke="#555555" stroke-width="1.5" />`;
      
      let labelR = r + 20;
      let lx = cx + labelR * Math.cos(angle);
      let ly = cy + labelR * Math.sin(angle);
      
      let textAnchor = "middle";
      if (Math.cos(angle) > 0.1) textAnchor = "start";
      else if (Math.cos(angle) < -0.1) textAnchor = "end";
      
      svg += `<text x="${lx}" y="${ly}" fill="#2b2927" font-size="13" font-family="Noto Serif SC, serif" font-weight="bold" text-anchor="${textAnchor}" dominant-baseline="middle">${key}</text>`;
      svg += `<text x="${lx}" y="${ly + 15}" fill="#7a756e" font-size="11" font-family="Noto Serif SC, serif" text-anchor="${textAnchor}" dominant-baseline="middle">${val} / ${maxVal}</text>`;
    }
    
    svg += `</svg>`;
    document.getElementById(containerId).innerHTML = svg;
  }

  function showProfile(id) {
    const oc = ocDatabase.find(o => o.id === id);
    if(!oc) return;

    const avatarBox = document.getElementById('p-avatar-box');
    if (oc.avatar) {
      avatarBox.innerHTML = `<img src="${oc.avatar}" alt="${oc.name}">`;
      const imgEl = avatarBox.querySelector('img');
      imgEl.onerror = function() {
        this.style.display = 'none';
        avatarBox.innerHTML = `<div class="empty-text">暂无画像</div>`;
      };
    } else {
      avatarBox.innerHTML = `<div class="empty-text">暂无画像</div>`;
    }

    document.getElementById('p-name').textContent = oc.name;
    document.getElementById('p-title').textContent = oc.title;
    document.getElementById('p-top-id').textContent = `档案：${oc.id.toUpperCase()}`;

    const infoGrid = document.getElementById('p-info-grid');
    infoGrid.innerHTML = '';
    oc.basic.forEach(b => {
      infoGrid.innerHTML += `<div class="info-item"><span class="k">${b.k}</span><span class="v">${b.v}</span></div>`;
    });

    document.getElementById('p-personality').textContent = oc.personality || '暂无记录';

    const timelineBox = document.getElementById('p-timeline');
    timelineBox.innerHTML = '';
    oc.timeline.forEach(item => {
      timelineBox.innerHTML += `<div class="tl-item"><div class="tl-time">${item.time}</div><div class="tl-event">${item.event}</div></div>`;
    });

    const relationsBox = document.getElementById('p-relations');
    relationsBox.innerHTML = '';
    if (oc.relations && oc.relations.length > 0) {
      oc.relations.forEach(rel => {
        const exists = ocDatabase.find(o => o.id === rel.id);
        const hasLink = exists && rel.id !== '';
        const cardClass = hasLink ? 'rel-card has-link' : 'rel-card no-link';
        
        const relCard = document.createElement('div');
        relCard.className = cardClass;
        if (hasLink) {
          relCard.onclick = function() { showProfile(rel.id); };
        }
        relCard.innerHTML = `<div class="rel-name">${rel.name}</div><div class="rel-desc">${rel.desc}</div>`;
        relationsBox.appendChild(relCard);
      });
    } else {
      relationsBox.innerHTML = '<div class="text-box">暂无记录</div>';
    }

    renderRadarChart(oc.stats, 'p-stats');
    
    switchView('view-profile');
  }

  window.onload = function() { 
    renderDirectory(); 
  };
</script>
</body>
</html>
