<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俗缘诡事 · 角色档案库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Oswald:wght@200;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f6f1; --paper: #1a1a1a; --muted: #888888; 
    --cinnabar: #b84040; --jade: #4a6255; --line: rgba(26, 26, 26, 0.15);
    --serif: "Noto Serif SC", "Songti SC", serif;
    --eng: "Oswald", sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  
  body{
    background-color: var(--bg); color:var(--paper); font-family:var(--serif);
    line-height: 2; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    transition: background-color 0.8s, color 0.8s;
  }
  
  .view { display: none; opacity: 0; transition: opacity .5s ease; position: relative; z-index: 1; min-height: 100vh; }
  .view.active { display: block; opacity: 1; }

  /* 首页基础样式 */
  #view-main { padding: 80px 40px; }
  .main-header { text-align: center; margin-bottom: 80px; }
  .home-title-img { max-width: 80vw; max-height: 150px; object-fit: contain; }
  .directory-wrap { max-width: 900px; margin: 0 auto; }
  .dir-header { font-family: var(--eng); font-size: 14px; letter-spacing: .4em; color: var(--muted); margin-bottom: 40px; display: flex; align-items: center; gap: 20px; }
  .dir-header::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .list-item { display: flex; align-items: baseline; justify-content: space-between; padding: 30px 10px; border-bottom: 1px solid var(--line); cursor: pointer; transition: .4s; position: relative; }
  .list-item:hover { padding-left: 30px; background: rgba(255,255,255,0.4); }
  .item-left { display: flex; align-items: baseline; gap: 30px; }
  .item-index { font-family: var(--eng); font-size: 16px; color: var(--muted); width: 30px; }
  .item-name { font-size: 36px; font-weight: 900; letter-spacing: .1em; color: var(--paper); transition: .4s; }
  .item-title { font-size: 13px; color: var(--jade); letter-spacing: .1em; text-align: right; max-width: 50%; }

  /* 详情页基础样式 */
  #view-profile { padding-bottom: 100px; background: var(--bg); transition: background-color 0.8s; }
  .nav-top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; mix-blend-mode: difference; }
  .back-btn { font-family: var(--eng); font-size: 14px; color: #fff; cursor: pointer; letter-spacing: .2em; }
  .nav-top .id-tag { font-family: var(--eng); font-size: 12px; color: #fff; letter-spacing: .1em; }
  
  /* 隐藏的印记按钮 */
  .glitch-trigger {
    position: fixed; top: 70px; right: 40px; z-index: 999;
    width: 30px; height: 30px; cursor: pointer; opacity: 0.15; 
    transition: opacity 0.4s, transform 0.4s; display: none; 
  }
  .glitch-trigger::before, .glitch-trigger::after {
    content: ""; position: absolute; top: 50%; left: 50%; border-radius: 50%; border: 1px solid var(--paper);
  }
  .glitch-trigger::before { width: 20px; height: 20px; transform: translate(-50%, -50%); border-style: dashed; }
  .glitch-trigger::after { width: 10px; height: 10px; transform: translate(-50%, -50%); background: var(--paper); }
  .glitch-trigger:hover { opacity: 1; transform: rotate(90deg); }

  .profile-wrap { max-width: 1000px; margin: 0 auto; padding: 120px 30px 40px 30px; }
  .hero-section { position: relative; margin-bottom: 80px; display: flex; justify-content: space-between; align-items: flex-end; }
  .avatar-box { width: 300px; aspect-ratio: 3/4; position: relative; box-shadow: 20px 20px 0px rgba(74, 98, 85, 0.1); transition: all 0.6s; }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.6s; }
  .avatar-box .empty-text { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--line); }
  .hero-text { display: flex; flex-direction: column; align-items: flex-end; text-align: right; padding-bottom: 20px; }
  .p-name { font-size: clamp(60px, 10vw, 100px); font-weight: 900; letter-spacing: .15em; color: var(--paper); line-height: 1; margin-bottom: 20px; transition: color 0.6s; }
  .p-title { font-size: 14px; color: var(--jade); letter-spacing: .3em; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 20px; transition: color 0.6s; }

  .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px 60px; }
  .sec-title { font-family: var(--eng); font-size: 24px; font-weight: 200; color: var(--paper); letter-spacing: .2em; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; transition: color 0.6s;}
  .sec-title::before { content: ""; width: 20px; height: 1px; background: var(--cinnabar); transition: background-color 0.6s;}
  .sec-title span { font-size: 12px; color: var(--muted); font-family: var(--serif); letter-spacing: .3em; transition: color 0.6s;}

  .info-list { display: flex; flex-direction: column; }
  .info-item { display: flex; padding: 15px 0; border-bottom: 1px dashed var(--line); align-items: baseline; transition: border-color 0.6s;}
  .info-item:last-child { border-bottom: none; }
  .info-item .k { width: 80px; color: var(--muted); font-size: 13px; letter-spacing: .1em; flex-shrink: 0; transition: color 0.6s;}
  .info-item .v { font-size: 15px; color: var(--paper); font-weight: 600; letter-spacing: .05em; transition: color 0.6s;}

  .stats-container { padding: 20px 0; display: flex; justify-content: flex-start; }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 1px; background: var(--line); transition: background-color 0.6s;}
  .tl-item { position: relative; margin-bottom: 40px; }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-item::before { content: ""; position: absolute; left: -24px; top: 8px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--jade); background: var(--bg); transition: all 0.6s;}
  .tl-time { font-family: var(--eng); font-size: 16px; color: var(--cinnabar); letter-spacing: .1em; margin-bottom: 5px; transition: color 0.6s;}
  .tl-event { font-size: 14px; color: var(--muted); line-height: 1.8; transition: color 0.6s;}

  .relations-list { display: flex; flex-direction: column; gap: 0; }
  .rel-item { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 20px; transition: border-color 0.6s;}
  .rel-item.has-link { cursor: pointer; }
  .rel-name { font-size: 18px; font-weight: 600; color: var(--paper); min-width: 80px; transition: color 0.6s;}
  .rel-desc { font-size: 13px; color: var(--muted); flex: 1; transition: color 0.6s;}
  footer { margin-top: 120px; text-align: center; font-family: var(--eng); font-size: 12px; letter-spacing: .5em; color: var(--muted); transition: color 0.6s;}

  .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease; }
  .reveal.active { opacity: 1; transform: translateY(0); }
  .delay-item { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
  .delay-item.active { opacity: 1; transform: translateY(0); }
  .reveal-radar { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
  .reveal-radar.active { opacity: 1; transform: translateY(0); }
  .radar-text { opacity: 0; transition: opacity 0.5s ease; }
  .radar-text.show { opacity: 1; }

  /* =========================================
     🐛 里世界：幽冥墨绿与猩红
     ========================================= */
  body.glitch-mode {
    --bg: #050a08; --paper: #ff3333; --muted: #5e8c6a; 
    --cinnabar: #00ff00; --jade: #ff3333; --line: rgba(0, 255, 0, 0.2);
    background-color: var(--bg);
    background-image: radial-gradient(circle, #0a1c14 0%, #050a08 100%);
    animation: screen-glitch 0.15s infinite; 
  }
  body.glitch-mode .cp-name {
    color: var(--paperinn);
    animation: text-glitch abar1.5s infinite;
    text-shadow);: 2px 0 #00ff00, }

 -2px 0 #ff 3333;
  }
  body.glitch-mode .avatar-box {
    box-shadow: 20px 20px 0px rgba(0, 255, 0, 0.2);
    border: 1px solid #00ff00;
  }
  body.glitch-mode .avatar-box img {
    filter: contrast(1.5) hue-rotate(90deg) sepia(0.5); 
  }
  body.glitch-mode .glitch-trigger { opacity: 0.8; border-color: var(--cinnabar); }
  body.glitch-mode .glitch-trigger::before { border-color: var(--cinnabar); }
  body.glitch-mode .glitch-trigger::after { background: var(-- @keyframes screen-glitch {
    0% { transform: translate(0) }
    20% { transform: translate(-1px, 1px) }
    40% { transform: translate(-1px, -1px) }
    60% { transform: translate(1px, 1px) }
    80% { transform: translate(1px, -1px) }
    100% { transform: translate(0) }
  }
  @keyframes text-glitch {
    0%, 100% { transform: skew(0deg); }
    10% { transform: skew(-5deg); opacity: 0.8; }
    12% { transform: skew(5deg); opacity: 1; }
    50% { transform: skew(0deg); }
    52% { transform: skew(3deg); opacity: 0.9; }
    54% { transform: skew(0deg); opacity: 1; }
  }

  @media (max-width: 768px) {
    #view-main { padding: 50px 20px; }
    .list-item { flex-direction: column; align-items: flex-start; gap: 10px; }
    .item-name { font-size: 28px; }
    .item-title { text-align: left; max-width: 100%; }
    .profile-wrap { padding-top: 80px; }
    .hero-section { flex-direction: column; align-items: flex-start; gap: 20px; margin-bottom: 50px; }
    .avatar-box { width: 100%; max-width: 200px; }
    .hero-text { align-items: flex-start; text-align: left; padding-bottom: 0; width: 100%; }
    .content-grid { grid-template-columns: 1fr; gap: 50px; }
    .rel-item { flex-direction: column; gap: 5px; }
    .glitch-trigger { top: 80px; right: 20px; }
  }
</style>
</head>
<body>

<div id="view-main" class="view active">
  <header class="main-header">
    <img src="title.png" class="home-title-img" alt="俗缘诡事" onerror="this.style.display='none'">
  </header>
  <div class="directory-wrap">
    <div class="dir-header">Character Index / 人物卷宗</div>
    <div id="dir-list"></div>
  </div>
</div>

<div id="view-profile" class="view">
  <div class="glitch-trigger" id="glitch-btn" onclick="toggleGlitch()"></div>
  
  <div class="nav-top">
    <div class="back-btn" onclick="switchView('view-main')">← BACK</div>
    <div class="id-tag" id="p-top-id"></div>
  </div>
  <div class="profile-wrap">
    <div class="hero-section">
      <div class="avatar-box" id="p-avatar-box"></div>
      <div class="hero-text">
        <h1 class="p-name" id="p-name"></h1>
        <div class="p-title" id="p-title"></div>
      </div>
    </div>
    <div class="content-grid">
      <div>
        <div class="sec-title">PROFILE <span>基础卷宗</span></div>
        <div class="info-list" id="p-info-list"></div>
        
        <div class="sec-title" style="margin-top: 60px;">STATS <span>命理六维</span></div>
        <div class="stats-container reveal-radar" id="p-stats"></div>
      </div>
      <div>
        <div class="sec-title">TIMELINE <span>生平轨迹</span></div>
        <div class="timeline" id="p-timeline"></div>
        
        <div class="sec-title" style="margin-top: 60px;">RELATIONS <span>人际羁绊</span></div>
        <div class="relations-list" id="p-relations"></div>
      </div>
    </div>
    <footer>SUYUAN GUISHI</footer>
  </div>
</div>

<script>
  let isGlitchMode = false;
  let currentActiveId = "";

  const observerOptions = { root: null, rootMargin: '0px 0px -50px 0px', threshold: 0.1 };
  const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('active');
        if (entry.target.id === 'p-stats') {
          const radarData = entry.target.querySelector('.radar-anim-group');
          const radarText = entry.target.querySelector('.radar-text');
          if (radarData) animateRadarLines(radarData, radarText);
        }
        observer.unobserve(entry.target);
      }
    });
  }, observerOptions);

  function loadData() {
    const script = document.createElement('script');
    script.src = 'data.js?v=' + new Date().getTime(); 
    script.onload = function() { renderDirectory(); };
    document.head.appendChild(script);
  }

  function renderDirectory() {
    const list = document.getElementById('dir-list');
    list.innerHTML = '';
    ocDatabase.forEach((oc, index) => {
      const item = document.createElement('div');
      item.className = 'list-item reveal';
      item.onclick = function() { showProfile(oc.id); };
      item.style.transitionDelay = `${index * 0.1}s`; 
      const num = String(index + 1).padStart(2, '0');
      item.innerHTML = `
        <div class="item-left">
          <span class="item-index">${num}</span>
          <span class="item-name">${oc.name}</span>
        </div>
        <div class="item-title">${oc.title}</div>
      `;
      list.appendChild(item);
      setTimeout(() => observer.observe(item), 100);
    });
  }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
    
    if (viewId === 'view-main') {
      document.body.classList.remove('glitch-mode');
      isGlitchMode = false;
    }
  }

  function toggleGlitch() {
    isGlitchMode = !isGlitchMode;
    if (isGlitchMode) {
      document.body.classList.add('glitch-mode');
    } else {
      document.body.classList.remove('glitch-mode');
    }
    showProfile(currentActiveId, true);
  }

  function animateRadarLines(group, textGroup) {
    const circles = group.querySelectorAll('circle');
    const poly = group.querySelector('polygon');
    const targets = [];
    const cx = 150, cy = 140;
    
    circles.forEach(c => {
      const tx = parseFloat(c.getAttribute('data-tx'));
      const ty = parseFloat(c.getAttribute('data-ty'));
      const distance = Math.hypot(tx - cx, ty - cy);
      targets.push({ el: c, tx, ty, distance });
    });

    const maxDistance = Math.hypot(90, 0); 
    const speed = maxDistance / 1500; 
    
    let maxTime = 0;
    targets.forEach(t => {
      t.duration = t.distance / speed;
      if(t.duration > maxTime) maxTime = t.duration;
    });

    const startTime = performance.now();
    circles.forEach(c => { c.setAttribute('cx', cx); c.setAttribute('cy', cy); });
    poly.setAttribute('points', `${cx},${cy} ${cx},${cy} ${cx},${cy} ${cx},${cy} ${cx},${cy} ${cx},${cy}`);

    function update(now) {
      const elapsed = now - startTime;
      let currentPoints = [];
      let allFinished = true;
      targets.forEach(t => {
        let progress = Math.min(elapsed / t.duration, 1);
        if (progress < 1) allFinished = false; 
        let currentX = cx + (t.tx - cx) * progress;
        let currentY = cy + (t.ty - cy) * progress;
        t.el.setAttribute('cx', currentX);
        t.el.setAttribute('cy', currentY);
        currentPoints.push(`${currentX},${currentY}`);
      });
      poly.setAttribute('points', currentPoints.join(' '));
      if (!allFinished) {
        requestAnimationFrame(update);
      } else {
        textGroup.classList.add('show');
      }
    }
    requestAnimationFrame(update);
  }

  function renderRadarChart(stats, containerId) {
    const width = 300, height = 280, cx = width / 2, cy = height / 2, r = 90; 
    const keys = Object.keys(stats), n = keys.length, maxVal = 6; 
    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:350px; overflow:visible;">`;
    
    for (let level = 1; level <= maxVal; level++) {
      let points = [];
      let currentR = (r * level) / maxVal;
      for (let i = 0; i < n; i++) {
        let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        let x = cx + currentR * Math.cos(angle), y = cy + currentR * Math.sin(angle);
        points.push(`${x},${y}`);
      }
      let strokeColor = level === maxVal ? "rgba(26, 26, 26, 0.2)" : "rgba(26, 26, 26, 0.05)";
      if (isGlitchMode) strokeColor = level === maxVal ? "rgba(0, 255, 0, 0.3)" : "rgba(0, 255, 0, 0.1)";
      svg += `<polygon points="${points.join(' ')}" fill="none" stroke="${strokeColor}" stroke-width="1" stroke-dasharray="${level === maxVal ? '0' : '2 2'}" />`;
    }
    for (let i = 0; i < n; i++) {
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
      svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${isGlitchMode ? 'rgba(0, 255, 0, 0.15)' : 'rgba(26, 26, 26, 0.08)'}" stroke-width="1" />`;
    }
    svg += `<g class="radar-anim-group">`;
    let dataPoints = [];
    let circleTags = '';
    for (let i = 0; i < n; i++) {
      let val = stats[keys[i]], currentR = (r * val) / maxVal;
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let x = cx + currentR * Math.cos(angle), y = cy + currentR * Math.sin(angle);
      dataPoints.push(`${x},${y}`);
      circleTags += `<circle data-tx="${x}" data-ty="${y}" cx="${x}" cy="${y}" r="2.5" fill="${isGlitchMode ? '#050a08' : '#f7f6f1'}" stroke="${isGlitchMode ? '#00ff00' : '#b84040'}" stroke-width="1.5" />`;
    }
    svg += `<polygon points="${dataPoints.join(' ')}" fill="${isGlitchMode ? 'rgba(255, 51, 51, 0.15)' : 'rgba(74, 98, 85, 0.1)'}" stroke="${isGlitchMode ? '#ff3333' : '#4a6255'}" stroke-width="1.5" stroke-linejoin="round" />`;
    svg += circleTags;
    svg += `</g>`; 

    svg += `<g class="radar-text">`;
    for (let i = 0; i < n; i++) {
      let key = keys[i], val = stats[key], currentR = (r * val) / maxVal;
      let angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      let labelR = r + 25, lx = cx + labelR * Math.cos(angle), ly = cy + labelR * Math.sin(angle);
      let textAnchor = "middle";
      if (Math.cos(angle) > 0.1) textAnchor = "start"; else if (Math.cos(angle) < -0.1) textAnchor = "end";
      svg += `<text x="${lx}" y="${ly}" fill="${isGlitchMode ? '#ff3333' : '#1a1a1a'}" font-size="13" font-family="Noto Serif SC, serif" font-weight="600" text-anchor="${textAnchor}" dominant-baseline="middle">${key}</text>`;
      svg += `<text x="${lx}" y="${ly + 16}" fill="${isGlitchMode ? '#5e8c6a' : '#888'}" font-size="11" font-family="Oswald, sans-serif" text-anchor="${textAnchor}" dominant-baseline="middle">${val} / ${maxVal}</text>`;
    }
    svg += `</g>`; 
    document.getElementById(containerId).innerHTML = svg + `</svg>`;
  }

  function showProfile(id, isToggle = false) {
    if (!isToggle) {
      currentActiveId = id;
      document.body.classList.remove('glitch-mode');
      isGlitchMode = false;
    }

    const oc = ocDatabase.find(o => o.id === id);
    if(!oc) return;

    const avatarBox = document.getElementById('p-avatar-box');
    if (oc.avatar) {
      avatarBox.innerHTML = `<img src="${oc.avatar}" alt="${oc.name}">`;
      const imgEl = avatarBox.querySelector('img');
      imgEl.onerror = function() { this.style.display = 'none'; avatarBox.innerHTML = `<div class="empty-text">NO IMAGE</div>`; };
    } else { avatarBox.innerHTML = `<div class="empty-text">NO IMAGE</div>`; }

    if (id === 'yeyao') {
      document.getElementById('glitch-btn').style.display = 'block';
      
      if (isGlitchMode) {
        document.getElementById('p-name').textContent = "叶 瑶 ？";
        document.getElementById('p-title').textContent = "错误代码：虫化地缚灵 // 怨念溢满";
        document.getElementById('p-name').style.letterSpacing = "0.3em";
        
        document.getElementById('p-info-list').innerHTML = `
          <div class="info-item delay-item active"><span class="k">状态</span><span class="v" style="color:#ff3333">已死亡 / 异变</span></div>
          <div class="info-item delay-item active"><span class="k">形态</span><span class="v" style="color:#00ff00">虫化地缚灵</span></div>
          <div class="info-item delay-item active"><span class="k">执念</span><span class="v">让叶阮活过来。</span></div>
        `;
        document.getElementById('p-timeline').innerHTML = `
          <div class="tl-item delay-item active"><div class="tl-time" style="color:#00ff00">ERROR</div><div class="tl-event" style="color:#ff3333">数据已被幽冥篡改，无法读取。</div></div>
        `;
        document.getElementById('p-relations').innerHTML = `
          <div class="rel-item delay-item active"><div class="rel-name" style="color:#ff3333">叶阮</div><div class="rel-desc">不可触碰的执念。</div></div>
        `;
      } else {
        document.getElementById('p-name').textContent = oc.name;
        document.getElementById('p-title').textContent = oc.title;
        document.getElementById('p-name').style.letterSpacing = ".15em";
        
        const infoList = document.getElementById('p-info-list');
        infoList.innerHTML = '';
        oc.basic.forEach((b, i) => { 
          infoList.innerHTML += `<div class="info-item delay-item" style="transition-delay: ${i * 0.1}s"><span class="k">${b.k}</span><span class="v">${b.v}</span></div>`; 
        });

        const timelineBox = document.getElementById('p-timeline');
        timelineBox.innerHTML = '';
        oc.timeline.forEach((item, i) => { 
          timelineBox.innerHTML += `<div class="tl-item delay-item" style="transition-delay: ${i * 0.1}s"><div class="tl-time">${item.time}</div><div class="tl-event">${item.event}</div></div>`; 
        });

        const relationsBox = document.getElementById('p-relations');
        relationsBox.innerHTML = '';
        if (oc.relations && oc.relations.length > 0) {
          oc.relations.forEach((rel, i) => {
            const exists = ocDatabase.find(o => o.id === rel.id);
            const hasLink = exists && rel.id !== '';
            const relCard = document.createElement('div');
            relCard.className = hasLink ? 'rel-item has-link delay-item' : 'rel-item no-link delay-item';
            relCard.style.transitionDelay = `${i * 0.1}s`;
            if (hasLink) { relCard.onclick = function() { showProfile(rel.id); }; }
            relCard.innerHTML = `<div class="rel-name">${rel.name}</div><div class="rel-desc">${rel.desc}</div>`;
            relationsBox.appendChild(relCard);
          });
        }
      }
    } else {
      document.getElementById('glitch-btn').style.display = 'none';
      document.getElementById('p-name').textContent = oc.name;
      document.getElementById('p-title').textContent = oc.title;
      document.getElementById('p-name').style.letterSpacing = ".15em";

      const infoList = document.getElementById('p-info-list');
      infoList.innerHTML = '';
      oc.basic.forEach((b, i) => { 
        infoList.innerHTML += `<div class="info-item delay-item" style="transition-delay: ${i * 0.1}s"><span class="k">${b.k}</span><span class="v">${b.v}</span></div>`; 
      });

      const timelineBox = document.getElementById('p-timeline');
      timelineBox.innerHTML = '';
      oc.timeline.forEach((item, i) => { 
        timelineBox.innerHTML += `<div class="tl-item delay-item" style="transition-delay: ${i * 0.1}s"><div class="tl-time">${item.time}</div><div class="tl-event">${item.event}</div></div>`; 
      });

      const relationsBox = document.getElementById('p-relations');
      relationsBox.innerHTML = '';
      if (oc.relations && oc.relations.length > 0) {
        oc.relations.forEach((rel, i) => {
          const exists = ocDatabase.find(o => o.id === rel.id);
          const hasLink = exists && rel.id !== '';
          const relCard = document.createElement('div');
          relCard.className = hasLink ? 'rel-item has-link delay-item' : 'rel-item no-link delay-item';
          relCard.style.transitionDelay = `${i * 0.1}s`;
          if (hasLink) { relCard.onclick = function() { showProfile(rel.id); }; }
          relCard.innerHTML = `<div class="rel-name">${rel.name}</div><div class="rel-desc">${rel.desc}</div>`;
          relationsBox.appendChild(relCard);
        });
      }
    }

    document.getElementById('p-top-id').textContent = isGlitchMode ? "ERROR: UNKNOWN ENTITY" : `ID: ${oc.id.toUpperCase()}`;
    
    renderRadarChart(oc.stats, 'p-stats');
    
    if (!isToggle) {
      switchView('view-profile');
    } else {
      window.scrollTo(0, 0);
    }

    const radarContainer = document.getElementById('p-stats');
    radarContainer.classList.remove('active');
    document.querySelectorAll('.delay-item').forEach(el => el.classList.remove('active'));
    const textGroup = radarContainer.querySelector('.radar-text');
    if (textGroup) textGroup.classList.remove('show');

    void radarContainer.offsetWidth; 

    setTimeout(() => {
      observer.observe(radarContainer);
      document.querySelectorAll('.delay-item').forEach(el => {
        observer.observe(el);
      });
    }, 100);
  }

  window.onload = function() {
    loadData();
  };
</script>
</body>
</html>
